<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding quests</title>
<style>
  :root {
    --page: #FFFFFF;
    --ink: #1F1924;
    --muted: #6B6272;
    --accent: #9519EF;
    --accent-ink: #FFFFFF;
    --pale: #DFB7FF;
    --tint: #F7EEFF;
    --line: #E6DDEE;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #17111C;
      --ink: #F4EEF8;
      --muted: #A99DB3;
      --tint: #241A2D;
      --line: #3A2D46;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 72px 24px 56px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 750;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .lede {
    margin: 0 0 40px;
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 52ch;
  }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  a.quest {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 22px 24px;
    border: 1.5px solid var(--line);
    border-left: 6px solid var(--accent);
    border-radius: 14px;
    background: var(--tint);
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, transform .15s, background .15s;
  }
  a.quest:hover { border-color: var(--accent); transform: translateX(4px); }
  a.quest:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .text { flex: 1; min-width: 0; }
  .name { display: block; font-size: 1.25rem; font-weight: 700; }
  .desc { display: block; color: var(--muted); font-size: .95rem; margin-top: 2px; }
  .go {
    flex: none;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    display: grid; place-items: center;
  }
  .go svg { width: 18px; height: 18px; }
  @media (prefers-reduced-motion: reduce) {
    a.quest { transition: none; }
    a.quest:hover { transform: none; }
  }
  @media (max-width: 480px) {
    main { padding-top: 48px; }
    a.quest { padding: 18px; }
  }
</style>
</head>
<body>
<main>
  <h1>Onboarding quests</h1>
  <p class="lede">Choose what you want to onboard.</p>
  <ul>
    <li>
      <a class="quest" href="fleet-quest.html">
        <span class="text">
          <span class="name">Customer onboarding</span>
          <span class="desc">Set up a new customer account.</span>
        </span>
        <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </li>
    <li>
      <a class="quest" href="vehicle-quest.html">
        <span class="text">
          <span class="name">Vehicle onboarding</span>
          <span class="desc">Add a vehicle to a customer's fleet.</span>
        </span>
        <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </li>
    <li>
      <a class="quest" href="tyre-quest.html">
        <span class="text">
          <span class="name">Tyre onboarding</span>
          <span class="desc">Register tyres for a vehicle.</span>
        </span>
        <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
